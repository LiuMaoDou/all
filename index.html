<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛豆百脑汇</title>
    <meta name="color-scheme" content="light dark">
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="statusBanner" class="status-banner" role="alert" hidden>
        <span id="statusMessage"></span><button id="retryLoad" type="button">重新加载</button>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>毛豆百脑汇</h1>
                <p>⚡️🔥🌈🎉✨🎯</p>
            </div>
            <nav class="nav-list" id="navList" aria-label="工具分类">
                <div class="loading">加载中...</div>
            </nav>
            <div class="sidebar-footer">
                <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题" aria-pressed="false">
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button class="icon-btn" id="editToggle" title="编辑模式" aria-label="编辑模式" aria-pressed="false">
                    <svg viewBox="0 0 24 24">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <main class="main-content" id="mainContent" aria-label="工具列表">
            <div class="loading">正在连接数据库...</div>
        </main>
    </div>

    <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="editTitle">
        <form class="modal-content" id="editForm">
            <div class="modal-header" id="editTitle">编辑工具</div>
            <div class="form-group">
                <label for="editCategory">所属分类</label>
                <select id="editCategory"></select>
            </div>
            <div class="form-group">
                <label for="editLogo">Logo（上传图片或输入 Emoji / URL）</label>
                <div class="logo-input-row">
                    <input type="text" id="editLogo" placeholder="🤖 或 https://...">
                    <label class="upload-btn" role="button" tabindex="0" aria-label="上传 Logo 图片">
                        <span id="uploadLabel">📷 上传</span>
                        <input type="file" id="editLogoFile" accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.ico" style="display:none;">
                    </label>
                </div>
                <div id="logoPreview"></div>
            </div>
            <div class="form-group">
                <label for="editName">工具名称</label>
                <input type="text" id="editName" required maxlength="200" placeholder="输入工具名称">
            </div>
            <div class="form-group">
                <label for="editDescription">工具描述</label>
                <textarea id="editDescription" maxlength="10000" placeholder="输入工具描述"></textarea>
            </div>
            <div class="form-group">
                <label for="editUrl">工具网址</label>
                <input type="url" id="editUrl" maxlength="4096" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="saveEdit" type="submit">保存修改</button>
                <button class="btn-secondary" id="cancelEdit" type="button">取消</button>
            </div>
        </form>
    </div>

    <script src="/app.js" defer></script>
</body>
</html>
